name: Build honker.dev

# Build check only. This workflow does NOT deploy.
#
# Deploying needs a Cloudflare API token with Pages Edit, and we
# deliberately do not keep one in this repository's secrets. Publishing
# is a local step instead, against a wrangler OAuth login:
#
#     npm run deploy          # production -> honker.dev
#
# See README.md. What CI is for here is catching a site that does not
# build — broken MDX, a bad import, a dead component — before it is
# merged, which is the failure that actually reaches a reader.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
